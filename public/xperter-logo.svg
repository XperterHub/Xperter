<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background squircle linear fill -->
    <linearGradient id="tile-bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Squircle frosted rim stroke -->
    <linearGradient id="tile-rim" x1="70" y1="50" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.32" />
    </linearGradient>

    <!-- Liquid chrome gradient for the 'X' glyph arcs -->
    <linearGradient id="chrome-arc" x1="160" y1="120" x2="352" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="22%" stop-color="#E2E8F0" />
      <stop offset="48%" stop-color="#64748B" />
      <stop offset="74%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Specular highlight bevel gradient -->
    <linearGradient id="chrome-specular" x1="180" y1="100" x2="330" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle cyan atmospheric backlight glow behind the glyph -->
    <radialGradient id="cyan-glow" cx="256" cy="256" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Inner shadow / glass glow filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow behind the squircle -->
  <rect x="52" y="52" width="408" height="408" rx="100" fill="#38BDF8" opacity="0.12" filter="url(#glow-filter)" />

  <!-- Outer obsidian squircle tile with frosted glass rim -->
  <rect
    x="60"
    y="60"
    width="392"
    height="392"
    rx="92"
    fill="url(#tile-bg)"
    stroke="url(#tile-rim)"
    stroke-width="5"
  />

  <!-- Internal cyan neon aura behind glyph -->
  <circle cx="256" cy="256" r="140" fill="url(#cyan-glow)" />

  <!-- Upper concave chrome arc (top half of 'X') -->
  <g>
    <!-- Bevel shadow underlay -->
    <path
      d="M148 140 C148 140 188 244 256 244 C324 244 364 140 364 140 C364 140 376 160 376 168 C376 174 344 266 256 266 C168 266 136 174 136 168 C136 160 148 140 148 140 Z"
      fill="#05080F"
      opacity="0.65"
    />
    <!-- Main Upper Arc -->
    <path
      d="M152 144 C152 144 190 236 256 236 C322 236 360 144 360 144 L370 156 C370 162 338 254 256 254 C174 254 142 162 142 156 Z"
      fill="url(#chrome-arc)"
      stroke="url(#chrome-specular)"
      stroke-width="2.5"
    />
    <!-- Specular light edge -->
    <path
      d="M158 148 C186 216 226 234 256 234 C286 234 326 216 354 148"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>

  <!-- Lower convex chrome arc (bottom half of 'X') -->
  <g>
    <!-- Bevel shadow underlay -->
    <path
      d="M148 372 C148 372 188 268 256 268 C324 268 364 372 364 372 C364 372 376 352 376 344 C376 338 344 246 256 246 C168 246 136 338 136 344 C136 352 148 372 148 372 Z"
      fill="#05080F"
      opacity="0.65"
    />
    <!-- Main Lower Arc -->
    <path
      d="M152 368 C152 368 190 276 256 276 C322 276 360 368 360 368 L370 356 C370 350 338 258 256 258 C174 258 142 350 142 356 Z"
      fill="url(#chrome-arc)"
      stroke="url(#chrome-specular)"
      stroke-width="2.5"
    />
    <!-- Specular light edge -->
    <path
      d="M158 364 C186 296 226 278 256 278 C286 278 326 296 354 364"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>

  <!-- Central specular sparkle node at intersection -->
  <circle cx="256" cy="256" r="3.5" fill="#FFFFFF" opacity="0.95" />
</svg>
